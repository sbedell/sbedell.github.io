<!DOCTYPE html>
<html lang="en-US">
<head>
	<title>Soundboard</title>
	<meta charset="UTF-8">
	<meta name="author" content="Steve Bedell">
	<meta name="description" content="HTML 5 soundboard.">
	<meta name="keywords" content="HTML5, Mobile, Soundboard, IBM">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<link href="/favicon.ico" rel="icon" type="image/x-icon">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Martian+Mono:wght@400;700&display=swap">
	<link rel="stylesheet" href="./css/mainStyles.css">
	<link rel="stylesheet" href="./css/soundboard-styles.css">
</head>

<body>
	<audio id="airhorn" src="soundboardPWA/audio/AIRHORN.mp3"></audio>
	<audio id="multi-airhorn" src="soundboardPWA/audio/multiAirhorn.mp3"></audio>
	<audio id="damnson" src="soundboardPWA/audio/damn-son.mp3"></audio>
	<audio id="smoke" src="soundboardPWA/audio/SMOKEWEEDEVERYDAY.mp3"></audio>
	<audio id="ahahah" src="soundboardPWA/audio/ah-ah-ah-v2.wav"></audio>
	<audio id="holdon" src="soundboardPWA/audio/holdontoyourbutts.mp3"></audio>
	<audio id="niceme" src="soundboardPWA/audio/nicememe.mp3"></audio>
	<!-- <audio id="steam-machine" src="soundboardPWA/audio/Steam-Machine.mp3"></audio> -->
	<audio id="djt" src="soundboardPWA/audio/DonaldJigglypuffTrump.mp3"></audio>
	<audio id="mario-1up" src="soundboardPWA/audio/Mario-1up-louder.mp3"></audio>
	<audio id="pkmn-item" src="soundboardPWA/audio/SFX_GET_ITEM_1.wav"></audio>
	<audio id="pkmn-key-item" src="soundboardPWA/audio/SFX_GET_KEY_ITEM.wav"></audio>
	<audio id="yu-gi-oh" src="soundboardPWA/audio/YugiohTimeToDDDDDDuel.mp3"></audio>
	<audio id="gahdamn" src="soundboardPWA/audio/GahDamn.mp3"></audio>
	<audio id="milk" src="soundboardPWA/audio/He-needs-some-milk.mp3"></audio>
	<audio id="tuba-meme" src="soundboardPWA/audio/stewie-tuba-meme.mp3"></audio>

	<!-- TODO - Add Spongebob dolphin noise, and DJ rewind sample -->

	<header class="hero centered">
		<p class="hero-prompt reveal">~/steve-bedell/soundboard $</p>
		<h1>Soundboard</h1>
		<p class="hero-tagline reveal" style="--delay: 0.15s">HTML5 Audio meme machine — sound on</p>
	</header>

	<div class="page">
		<main>
			<button class="my-btn btn-block" onclick="playAudio('airhorn')">AIRHORN</button>
			<button class="my-btn btn-block" onclick="playAudio('multi-airhorn')">MULTI AIRHORN</button>
			<button class="my-btn btn-block" onclick="playAudio('damnson')">DAMN SON WHERE'D YOU FIND THIS</button>
			<button class="my-btn btn-block" onclick="playAudio('smoke')">SMOKE WEED EVERY DAY</button>
			<button class="my-btn btn-block" onclick="playAudio('niceme')">NICE MEME</button>
			<!-- <button class="my-btn btn-block" onclick="playAudio('steam-machine')">STEAM MACHINE</button> -->
			<button class="my-btn btn-block" onclick="playAudio('djt')">DONALD JIGGLYPUFF TRUMP</button>
			<button class="my-btn btn-block" onclick="playAudio('gahdamn')">GAH DAMN</button>
			<button class="my-btn btn-block" onclick="playAudio('mario-1up')">1 UP</button>
			<button class="my-btn btn-block" onclick="playAudio('pkmn-item')">Pokemon Item</button>
			<button class="my-btn btn-block" onclick="playAudio('pkmn-key-item')">Pokemon Key Item</button>
			<button class="my-btn btn-block" onclick="playAudio('yu-gi-oh')">Time to Duel!</button>
			<button class="my-btn btn-block" onclick="playAudio('milk')">HE NEEDS SOME MILK!</button>
			<button class="my-btn btn-block" onclick="playAudio('tuba-meme')">Stewie Tuba</button>

			<h3>Jurassic Park soundbytes</h3>
			<button class="my-btn btn-block" onclick="playAudio('ahahah')">AH AH AH You Didn't Say The Magic Word</button>
			<button class="my-btn btn-block" onclick="playAudio('holdon')">HOLD ON TO YOUR BUTTS</button>
			<hr>
			<button class="my-btn btn-danger btn-block" onclick="playAllAudio()">PLAY ALL (WARNING - DUMB)</button>
			<button class="my-btn btn-danger btn-block" onclick="playRandomClips()">Play 5 Random Clips</button>
		</main>

		<footer class="main-footer">
			<hr>
			<p>&copy; Steve Bedell 2016 - <span id="copyright-date"></span></p>
			<p>Check out the Web App version <a href="./soundboardPWA/">here</a> to install to your home screen!</p>
			<p class="home-link"><a href="./">Back to Home page</a></p>
		</footer>
	</div>

	<script src="soundboardPWA/soundboard.js"></script>
	<script>
		document.getElementById("copyright-date").innerText = `${new Date().getFullYear()}`;
	</script>
</body>
</html>
